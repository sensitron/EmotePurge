<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="ep-classic-title">
  <title id="ep-classic-title">EmotePurge</title>
  <!--
    The original mark, vectorised and recoloured. The shapes are traced from
    web/branding sources at 512 px by marching squares over two masks (the
    silhouette and the near-black facial features), simplified with
    Ramer-Douglas-Peucker at about 1 px. Nothing was redrawn: this is the same
    swirl, the same wink, the same three shed tiles.

    What changed is the paint. The purple-to-magenta gradient is gone; the body
    is one flat guide turquoise, which is the whole point of the exercise. Flat
    means it carries on graphite and on paper without a second file.

    The fill uses a CSS custom property with a literal fallback, so an inlined
    copy follows the theme while a copy behind an img element falls back.
    Careful: XML forbids a doubled hyphen inside a comment, so the property
    name cannot be spelled out here.
  -->
