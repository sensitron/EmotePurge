<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Emote Purge</title>
    <base href="/" />
    <!-- After <base>, so the relative src resolves against it; synchronous and render-blocking on
         purpose, so <html data-theme> is set before the first paint. See the file's own comment
         for why it is not inline. -->
    <script src="theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Two tags with a media query cover the "follow the system" case with no JavaScript at all.
         On an explicit user choice ThemeService rewrites the two `media` attributes (all / not all),
         because otherwise the system preference would still pick the wrong one. The colours live
         here and only here — the service never hardcodes them. The PWA manifest deliberately keeps
         a single dark value: its splash belongs to the icon, which has #020617 baked in. -->
    <meta
      name="theme-color"
      data-theme-mode="dark"
      content="#0d0f12"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      data-theme-mode="light"
      content="#f2f3f5"
      media="(prefers-color-scheme: light)"
    />
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — Sprite-Atlas. Survives the production build on purpose:
      a contract nobody can read in the shipped output is a contract nobody audits.

      THESIS: Emotes are sprites, so show them as sprites — packed edge to edge on a
      sheet, the image IS the cell. Refuses the uniform card grid, where a 40 px emote
      sits inside a 144 px container of border, name, date and buttons.
      OWN-WORLD: Graphite ground with a trace of green (never slate), alpha-checker
      under the artwork, hairline guides that never glow, one signal turquoise used
      only for selection, focus and marking. Archivo for text, Azeret Mono for every
      number and index.
      STORY: The visitor sees where the weight of their set sits, judges sprite by
      sprite, and marks what leaves. The count is evidence, never the verdict.
      FIRST VIEWPORT: Edge-code header with the set's figures, one toolbar row,
      the ranked distribution, then the packed sheet in usage bands; sidecar right,
      action bar docked at the bottom once anything is marked.
      FORM: Sprite-Atlas, candidate 4 of the resonance list, seed d5364856. Uniform
      cell size chosen by the user over size-by-usage — judging beats surveying.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md.
    -->
    <app-root></app-root>
  </body>
</html>
