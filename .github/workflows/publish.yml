name: Publish Docker images

# Docs-only pushes (Markdown, docs/) skip the whole pipeline — nothing in the images can have
# changed, and republishing would only move the :latest tag to a bit-identical image with a new
# digest (a blind Portainer re-pull would then restart containers for nothing).
# pull_request runs the two test jobs only (see the publish job's if:) — optional branches for
# risky work get CI without changing the day-to-day trunk-based flow (Review 2026-07-29, S3-37).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # Ahead of the tests on purpose: this takes ~30s and fails fast, while the test job below
      # spins up Testcontainers. Reports formatting only — no analyzer opinions are configured.
      - name: Verify formatting (dotnet format)
        run: dotnet format EmotePurge.slnx --verify-no-changes

      # Testcontainers pulls postgres:16-alpine/redis:7.2-alpine and needs the Docker daemon
      # that ubuntu-latest runners already ship with.
      - name: Run tests
        run: dotnet test EmotePurge.slnx --configuration Release

  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # Both run before the test steps: they take a few seconds each, so a formatting or member
      # order slip fails the job immediately instead of after Chromium has been downloaded.
      - name: Verify formatting (Prettier)
        run: npm run format:check
        working-directory: web

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: web

      - name: Run unit tests (Vitest)
        run: npm test -- --watch=false
        working-directory: web

      # e2e specs mock every /api/** call (see web/e2e/support/mocks.ts) — no .NET Api/Postgres/
      # Redis/Twitch OAuth app needed here, only Chromium + the Angular dev server.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run e2e tests (Playwright)
        run: npm run e2e
        working-directory: web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  publish:
    # Tests gate every event; images are only ever published from main (push/manual), never from PRs.
    if: github.event_name != 'pull_request'
    needs: [test, test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: emotepurge-api
            dockerfile: src/EmotePurge.Api/Dockerfile
          - image: emotepurge-worker
            dockerfile: src/EmotePurge.Worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
