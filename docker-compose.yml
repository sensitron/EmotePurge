name: emote-purge

services:
  redis:
    image: redis:7.2-alpine
    container_name: emotepurge-redis
    restart: unless-stopped
    # s. docker-compose.prod.yml für die Begründung von maxmemory/allkeys-lru.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotepurge-network

  postgres:
    image: postgres:16-alpine
    container_name: emotepurge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emotepurge
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d emotepurge"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotepurge-network

  api:
    build:
      context: .
      dockerfile: src/EmotePurge.Api/Dockerfile
    container_name: emotepurge-api
    restart: unless-stopped
    # Loopback-gebunden wie redis/postgres oben — ForwardedHeadersMiddleware in Program.cs
    # vertraut X-Forwarded-Proto/-For ohne KnownProxies-Einschränkung, was voraussetzt, dass
    # der Container nicht direkt aus einem unvertrauten Netz erreichbar ist.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - Auth__Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Auth__Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
      - Auth__Twitch__RedirectUri=http://localhost:8080/api/auth/twitch/callback
      - Auth__Twitch__PostLoginRedirectUrl=/
      # Parität zu docker-compose.prod.yml, damit dieser Pfad lokal überhaupt getestet wird.
      - DataProtection__KeyPath=/keys
    volumes:
      - dataprotection-keys:/keys
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/EmotePurge.Worker/Dockerfile
    container_name: emotepurge-worker
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      # 7TV-EventAPI-Live-Updates (Default aus): Rollout/Rollback per Env-Wechsel ohne Rebuild.
      - SevenTv__EventApi__Enabled=${SEVENTV_EVENTAPI_ENABLED:-false}
      - SevenTv__ResyncIntervalSeconds=${SEVENTV_RESYNC_INTERVAL_SECONDS:-60}
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  dataprotection-keys:
    driver: local

networks:
  emotepurge-network:
    driver: bridge
