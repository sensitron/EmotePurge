# Dev project name deliberately differs from prod (S3-38): both files used to resolve
# to the same project/volume/container names, so a local `docker compose up` on the VPS
# would have attached to the production postgres-data volume without any warning.
name: emote-purge-dev

services:
  redis:
    image: redis:7.2-alpine
    container_name: emotepurge-dev-redis
    restart: unless-stopped
    # s. docker-compose.prod.yml für die Begründung von maxmemory/allkeys-lru.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotepurge-network

  postgres:
    image: postgres:16-alpine
    container_name: emotepurge-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emotepurge
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d emotepurge"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotepurge-network

  api:
    build:
      context: .
      dockerfile: src/EmotePurge.Api/Dockerfile
    container_name: emotepurge-dev-api
    restart: unless-stopped
    # S2-21: mirror the prod limits so a runaway is caught in dev first, not on the VPS.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # Loopback-gebunden wie redis/postgres oben — ForwardedHeadersMiddleware in Program.cs
    # vertraut X-Forwarded-Proto/-For ohne KnownProxies-Einschränkung, was voraussetzt, dass
    # der Container nicht direkt aus einem unvertrauten Netz erreichbar ist.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - Auth__Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Auth__Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
      - Auth__Twitch__TokenEncryptionKey=${AUTH_TWITCH_TOKEN_ENCRYPTION_KEY}
      - Auth__Twitch__RedirectUri=http://localhost:8080/api/auth/twitch/callback
      - Auth__Twitch__PostLoginRedirectUrl=/
      # Comma-separated. Overrides the appsettings.json array — without this the admin area is
      # reachable only by the login hardcoded there.
      - Auth__AdminTwitchLogins=${ADMIN_TWITCH_LOGINS}
      # Parität zu docker-compose.prod.yml, damit dieser Pfad lokal überhaupt getestet wird.
      - DataProtection__KeyPath=/keys
    volumes:
      - dataprotection-keys:/keys
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/EmotePurge.Worker/Dockerfile
    container_name: emotepurge-dev-worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      # 7TV-EventAPI-Live-Updates (Default aus): Rollout/Rollback per Env-Wechsel ohne Rebuild.
      - SevenTv__EventApi__Enabled=${SEVENTV_EVENTAPI_ENABLED:-false}
      - SevenTv__ResyncIntervalSeconds=${SEVENTV_RESYNC_INTERVAL_SECONDS:-60}
      # Client-Credentials für den Helix-Live-Poll (A10) — dieselbe Twitch-App wie die Api,
      # aber ein eigener App-Access-Token (kein User-Token, keine Scopes).
      - Auth__Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Auth__Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
      - Twitch__LivePollIntervalSeconds=${TWITCH_LIVE_POLL_INTERVAL_SECONDS:-300}
      # Channel-eigene Bots, die in keiner Fremdliste stehen (s. IBotChatterDetector) —
      # kommagetrennte Twitch-User-IDs, ergänzt die eingebaute statische Liste ohne Release.
      - Twitch__AdditionalBotAccountIds=${TWITCH_ADDITIONAL_BOT_ACCOUNT_IDS:-}
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # #69: die Akkuratheits-Sonde des Chat-Log-Backfills, ein zweiter Einstiegspunkt desselben
  # Worker-Images, kein Hosted Service (s. DECISIONS "Der Harness ist ein zweiter Einstiegspunkt
  # des Worker-Images, kein Hosted Service"). Läuft nie durch `up`, nur durch
  # `docker compose --profile harness run --rm harness <kanal> [--days <n>]`.
  harness:
    build:
      context: .
      dockerfile: src/EmotePurge.Worker/Dockerfile
    profiles: ["harness"]
    restart: "no"
    # `docker compose run` hängt seine Argumente an den entrypoint an, nicht an command — ein
    # `command` hier würde ersetzt, und ein `run` ohne Argumente landete beim vollen Worker-Start
    # statt in HarnessCommandLine.Parse's Invalid-Zweig (Codex-adversarial "Fail-open CLI").
    entrypoint: ["dotnet", "EmotePurge.Worker.dll", "harness"]
    healthcheck:
      # Der Heartbeat-Check des Images misst WorkerHealthPublisher; den gibt es hier nicht.
      disable: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Nur, weil AddWorkerCore die Redis-Registrierung für beide Einstiegspunkte gemeinsam
      # aufbaut — der Harness öffnet nie eine Verbindung.
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - SevenTv__EventApi__Enabled=${SEVENTV_EVENTAPI_ENABLED:-false}
      - SevenTv__ResyncIntervalSeconds=${SEVENTV_RESYNC_INTERVAL_SECONDS:-60}
      - Auth__Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Auth__Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
      - Twitch__LivePollIntervalSeconds=${TWITCH_LIVE_POLL_INTERVAL_SECONDS:-300}
      - Twitch__AdditionalBotAccountIds=${TWITCH_ADDITIONAL_BOT_ACCOUNT_IDS:-}
      - Harness__OutputDirectory=/data/harness
      - Harness__MaxMegabytesPerRun=${HARNESS_MAX_MEGABYTES_PER_RUN:-200}
    volumes:
      - ./harness-reports:/data/harness
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  dataprotection-keys:
    driver: local

networks:
  emotepurge-network:
    driver: bridge
