name: emote-purge

# Produktions-Stack für Portainer: zieht vorgebaute Images aus ghcr.io (per
# .github/workflows/publish.yml) statt lokal zu bauen. Für lokale Entwicklung
# weiterhin docker-compose.yml (docker compose up -d --build) verwenden.

services:
  redis:
    image: redis:7.2-alpine
    container_name: emotepurge-redis
    restart: unless-stopped
    # maxmemory + Eviction-Policy: Ohne Obergrenze wächst Redis bis der Host-Speicher ausgeht, und
    # dann fällt nicht nur der Rollen-Cache aus, sondern auch channel:bot:commands und
    # worker:health:twitch — der Bot verlöre seine Steuerung. Alle Keys hier sind Cache-Einträge mit
    # TTL bzw. kurzlebige Pub/Sub-Nachrichten, allkeys-lru ist daher unkritisch.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotepurge-network

  postgres:
    image: postgres:16-alpine
    container_name: emotepurge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emotepurge
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d emotepurge"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotepurge-network

  api:
    image: ghcr.io/sensitron/emotepurge-api:latest
    container_name: emotepurge-api
    restart: unless-stopped
    # S2-21: the VPS hosts a second, unrelated app — without limits a runaway container
    # can take the whole host down. Starting values per review; calibrate after the
    # first load test (Modul E precedes the stress test on purpose).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    ports:
      - "127.0.0.1:4300:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - Auth__Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Auth__Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
      - Auth__Twitch__TokenEncryptionKey=${AUTH_TWITCH_TOKEN_ENCRYPTION_KEY}
      - Auth__Twitch__RedirectUri=https://emotepurge.app/api/auth/twitch/callback
      - Auth__Twitch__PostLoginRedirectUrl=/
      # Comma-separated. Overrides the appsettings.json array — without this the admin area is
      # reachable only by the login hardcoded there.
      - Auth__AdminTwitchLogins=${ADMIN_TWITCH_LOGINS}
      # Ohne persistierten Schlüsselring erzeugt jeder Container-Neustart einen neuen und wirft alle
      # eingeloggten Nutzer heraus; mit zwei Api-Replicas würden Logins sporadisch fehlschlagen.
      - DataProtection__KeyPath=/keys
    volumes:
      - dataprotection-keys:/keys
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/sensitron/emotepurge-worker:latest
    container_name: emotepurge-worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      # 7TV-EventAPI-Live-Updates (Default aus): Rollout/Rollback per Env-Wechsel ohne Rebuild.
      - SevenTv__EventApi__Enabled=${SEVENTV_EVENTAPI_ENABLED:-false}
      - SevenTv__ResyncIntervalSeconds=${SEVENTV_RESYNC_INTERVAL_SECONDS:-60}
      # Client-Credentials für den Helix-Live-Poll (A10) — dieselbe Twitch-App wie die Api,
      # aber ein eigener App-Access-Token (kein User-Token, keine Scopes).
      - Auth__Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Auth__Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
      - Twitch__LivePollIntervalSeconds=${TWITCH_LIVE_POLL_INTERVAL_SECONDS:-300}
      # Channel-eigene Bots, die in keiner Fremdliste stehen (s. IBotChatterDetector) —
      # kommagetrennte Twitch-User-IDs, ergänzt die eingebaute statische Liste ohne Release.
      - Twitch__AdditionalBotAccountIds=${TWITCH_ADDITIONAL_BOT_ACCOUNT_IDS:-}
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  dataprotection-keys:
    driver: local

networks:
  emotepurge-network:
    driver: bridge
